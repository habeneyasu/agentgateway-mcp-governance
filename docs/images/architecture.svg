<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .h { font-size: 22px; font-weight: 700; }
      .b { font-size: 17px; fill: #334155; }
      .s { font-size: 15px; fill: #475569; }
      .zone { font-size: 16px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 14px; fill: #4f46e5; }
      .edge { font-size: 15px; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="title" x="60" y="68">agentgateway MCP governance: reference architecture</text>
  <text class="subtitle" x="60" y="102">Every request passes through one gateway. The MCP server is reachable only on an isolated internal network.</text>

  <!-- Token issuer -->
  <rect x="60" y="140" width="400" height="104" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="h" x="260" y="176" text-anchor="middle">Token issuer</text>
  <text class="s" x="260" y="204" text-anchor="middle">demo: scripts/generate_credentials.sh</text>
  <text class="s" x="260" y="228" text-anchor="middle">production: your identity provider</text>

  <!-- issuer -> client -->
  <line class="line" x1="230" y1="244" x2="230" y2="418" marker-end="url(#arrow)"/>
  <text class="edge" x="244" y="300">issues signed JWT</text>
  <text class="s" x="244" y="322">(sub, role)</text>

  <!-- issuer -> gateway (public keys) -->
  <path class="line" d="M460,192 L700,192 L700,328" marker-end="url(#arrow)"/>
  <text class="edge" x="478" y="180">public key set (JWKS), read-only</text>

  <!-- Zone: untrusted -->
  <rect x="40" y="340" width="350" height="440" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text class="zone" x="60" y="768">UNTRUSTED</text>

  <!-- Client -->
  <rect x="60" y="420" width="310" height="200" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text class="h" x="215" y="470" text-anchor="middle">MCP client / AI agent</text>
  <text class="b" x="215" y="510" text-anchor="middle">Discovers and calls tools</text>
  <text class="b" x="215" y="540" text-anchor="middle">over Streamable HTTP</text>
  <text class="b" x="215" y="580" text-anchor="middle">Authorization: Bearer &lt;JWT&gt;</text>

  <!-- client -> gateway -->
  <line class="line" x1="370" y1="520" x2="488" y2="520" marker-end="url(#arrow)"/>
  <text class="s" x="436" y="500" text-anchor="middle">HTTP</text>
  <text class="s" x="436" y="548" text-anchor="middle">127.0.0.1</text>

  <!-- Gateway -->
  <rect x="490" y="330" width="420" height="430" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text class="h" x="700" y="368" text-anchor="middle" style="font-size:26px">agentgateway v1.7</text>
  <text class="s" x="700" y="394" text-anchor="middle">policy enforcement point</text>

  <g>
    <rect x="515" y="412" width="370" height="56" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="b" x="535" y="446" style="font-weight:700">1  Authentication</text>
    <text class="mono" x="865" y="446" text-anchor="end">jwtAuth</text>

    <rect x="515" y="476" width="370" height="56" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="b" x="535" y="510" style="font-weight:700">2  Rate limiting</text>
    <text class="mono" x="865" y="510" text-anchor="end">localRateLimit</text>

    <rect x="515" y="540" width="370" height="56" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="b" x="535" y="574" style="font-weight:700">3  Tool authorization</text>
    <text class="mono" x="865" y="574" text-anchor="end">mcpAuthorization</text>

    <rect x="515" y="604" width="370" height="56" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="b" x="535" y="638" style="font-weight:700">4  Response guardrails</text>
    <text class="mono" x="865" y="638" text-anchor="end">mcpGuardrails</text>

    <rect x="515" y="668" width="370" height="56" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text class="b" x="535" y="702" style="font-weight:700">5  Observability</text>
    <text class="mono" x="865" y="702" text-anchor="end">logs + metrics</text>
  </g>

  <!-- gateway -> observability output -->
  <line class="line" x1="700" y1="760" x2="700" y2="806" marker-end="url(#arrow)"/>
  <rect x="490" y="808" width="420" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="b" x="700" y="834" text-anchor="middle">JSON access logs · Prometheus metrics</text>
  <text class="s" x="700" y="856" text-anchor="middle">metrics on 127.0.0.1:15020</text>

  <!-- Zone: isolated backend -->
  <rect x="1000" y="330" width="560" height="450" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text class="zone" x="1022" y="364" style="fill:#15803d">ISOLATED BACKEND NETWORK</text>
  <text class="s" x="1022" y="388">no published ports · no host access · no internet</text>

  <!-- gateway -> server -->
  <line class="line" x1="910" y1="520" x2="1018" y2="520" marker-end="url(#arrow)"/>
  <text class="s" x="955" y="500" text-anchor="middle">internal</text>
  <text class="s" x="955" y="548" text-anchor="middle">only</text>

  <!-- MCP server -->
  <rect x="1020" y="420" width="250" height="240" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="h" x="1145" y="462" text-anchor="middle">Python MCP server</text>
  <text class="b" x="1145" y="504" text-anchor="middle">4 read-only tools</text>
  <text class="b" x="1145" y="536" text-anchor="middle">input validation</text>
  <text class="b" x="1145" y="568" text-anchor="middle">field allowlists</text>
  <text class="b" x="1145" y="600" text-anchor="middle">non-root, read-only FS</text>
  <text class="s" x="1145" y="636" text-anchor="middle">returns raw fields</text>

  <!-- server -> db -->
  <line class="line" x1="1270" y1="540" x2="1318" y2="540" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <path d="M1320,450 a110,22 0 0 1 220,0 v190 a110,22 0 0 1 -220,0 z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <path d="M1320,450 a110,22 0 0 0 220,0" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="h" x="1430" y="508" text-anchor="middle">SQLite</text>
  <text class="s" x="1430" y="532" text-anchor="middle">synthetic data</text>
  <text class="s" x="1430" y="566" text-anchor="middle" style="font-weight:700;fill:#15803d">read-only, 3 ways</text>
  <text class="s" x="1430" y="592" text-anchor="middle">mode=ro + query_only</text>
  <text class="s" x="1430" y="616" text-anchor="middle">root-owned 0444 file</text>
  <text class="s" x="1430" y="640" text-anchor="middle">read-only container FS</text>

  <text class="s" x="1560" y="868" text-anchor="end">github.com/habeneyasu/agentgateway-mcp-governance</text>
</svg>
