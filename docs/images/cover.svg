<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="80" y="140" font-size="62" font-weight="800" fill="#ffffff">Beyond Connecting AI Agents</text>
  <text x="80" y="200" font-size="32" fill="#a5b4fc">Securing MCP Servers with agentgateway</text>

  <!-- Agent -->
  <rect x="80" y="340" width="240" height="150" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="200" y="405" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">AI agent</text>
  <text x="200" y="440" text-anchor="middle" font-size="18" fill="#94a3b8">MCP client + JWT</text>

  <line x1="320" y1="415" x2="418" y2="415" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="420" y="270" width="440" height="290" rx="20" fill="#312e81" stroke="#818cf8" stroke-width="3"/>
  <text x="640" y="318" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">agentgateway</text>
  <g font-size="20" fill="#e0e7ff">
    <rect x="450" y="340" width="380" height="36" rx="8" fill="#3730a3"/>
    <text x="640" y="365" text-anchor="middle">Authentication</text>
    <rect x="450" y="382" width="380" height="36" rx="8" fill="#3730a3"/>
    <text x="640" y="407" text-anchor="middle">Rate limiting</text>
    <rect x="450" y="424" width="380" height="36" rx="8" fill="#3730a3"/>
    <text x="640" y="449" text-anchor="middle">Tool authorization</text>
    <rect x="450" y="466" width="380" height="36" rx="8" fill="#3730a3"/>
    <text x="640" y="491" text-anchor="middle">Response guardrails</text>
    <rect x="450" y="508" width="380" height="36" rx="8" fill="#3730a3"/>
    <text x="640" y="533" text-anchor="middle">Observability</text>
  </g>

  <line x1="860" y1="415" x2="958" y2="415" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- MCP server -->
  <rect x="960" y="340" width="240" height="150" rx="16" fill="#1e293b" stroke="#4ade80" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1080" y="405" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">MCP server</text>
  <text x="1080" y="440" text-anchor="middle" font-size="18" fill="#94a3b8">isolated · read-only</text>

  <text x="80" y="650" font-size="22" fill="#94a3b8">Open-source reference implementation  ·  agentgateway v1.7  ·  MCP  ·  69 automated tests</text>
</svg>
