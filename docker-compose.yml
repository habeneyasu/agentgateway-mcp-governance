name: agentgateway-mcp-governance

services:
  mcp-server:
    build: ./mcp-server
    image: agentgateway-mcp-governance/mcp-server:local
    # No `ports:`. This server returns sensitive fields unmasked and must be
    # reachable only through the gateway, on the internal network.
    networks:
      - backend
    read_only: true          # whole root filesystem, including /data/finance.db
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0
    command: ["-f", "/config/agentgateway.yaml"]
    # SESSION_KEY encrypts MCP session IDs; generated by scripts/generate_credentials.sh.
    env_file:
      - path: ./gateway/credentials/gateway.env
        required: true
    volumes:
      - ./gateway/config:/config:ro
      # Public keys only; the signing key is never mounted.
      # Run scripts/generate_credentials.sh first.
      - ./gateway/credentials/jwks.json:/credentials/jwks.json:ro
    ports:
      # Loopback only. Widening this is an explicit, documented opt-in.
      - "127.0.0.1:${GATEWAY_PORT:-13000}:3000"
      # Prometheus metrics, loopback only.
      - "127.0.0.1:${METRICS_PORT:-15020}:15020"
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

networks:
  # No external connectivity: containers here can reach each other only.
  # `isolated` (Docker 28+) gives the bridge no address on the host, so even
  # processes on the Docker host cannot reach the MCP server's container IP.
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  # Lets the gateway's published port reach the host.
  frontend: {}
