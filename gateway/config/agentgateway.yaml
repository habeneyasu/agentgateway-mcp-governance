# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway v1.7 configuration for the MCP governance reference implementation.
#
# Policies: jwtAuth (Phase 4), mcpAuthorization (Phase 5), localRateLimit (Phase 6),
# mcpGuardrails (Phase 7). Observability: JSON access logs and metrics (Phase 8).
# Compose publishes the gateway and its metrics on 127.0.0.1 only.

config:
  # Prometheus metrics (agentgateway_mcp_requests_total, agentgateway_requests_total, ...).
  # Listens on all container interfaces; Compose publishes it on 127.0.0.1:15020 only.
  statsAddr: 0.0.0.0:15020
  logging:
    format: json
    fields:
      # Who called what, on every request log line. Fields whose expression
      # cannot be evaluated (e.g. no JWT on a rejected request) are omitted.
      add:
        user.id: jwt.sub
        user.role: jwt.role
        mcp.tool: mcp.tool.name

binds:
- port: 3000
  listeners:
  - name: mcp
    routes:
    - name: mcp-governance
      policies:
        # Every request needs a valid RS256 JWT from scripts/generate_credentials.sh.
        # Missing or invalid tokens are rejected before any MCP processing.
        jwtAuth:
          mode: strict
          issuer: agentgateway-mcp-governance
          audiences: [mcp-gateway]
          jwks:
            file: /credentials/jwks.json
        # Per-tool access by role. Rules are OR-ed; anything not allowed is denied.
        # Denied tools are removed from tools/list, and calls to them are rejected.
        # Allow rules only: an evaluation error then fails closed (no access).
        mcpAuthorization:
          rules:
          - 'jwt.role == "auditor"'
          - 'jwt.role == "analyst" && mcp.tool.name in ["get_customer", "get_account"]'
        # Per-user token bucket on HTTP requests (one MCP session uses ~5).
        # Each JWT subject gets its own bucket: bursts of up to 100, refilled at 20/s.
        localRateLimit:
        - type: requests
          key: jwt.sub
          maxTokens: 100
          tokensPerFill: 20
          fillInterval: 1s
        # Mask sensitive fields in every tool response before it leaves the gateway.
        # Tools return one JSON text block (no structuredContent), so rewriting
        # content[].text covers the whole response. Field-anchored masks keep the
        # last 4 characters; generic patterns then redact any national ID or email
        # left in other fields. Expression errors fail closed (the call is rejected).
        # agentgateway expands environment variables anywhere in this file, even in
        # comments, so a literal dollar sign is written `$$`: `$$1` is regex group 1.
        mcpGuardrails:
          processors:
          - kind: expression
            methods: {"tools/call": response}
            condition: has(mcp.result.content)
            transform: >-
              mcp.result.with(r, r.merge({
                'content': r.content.map(item,
                  item.type == 'text'
                    ? item.merge({'text': item.text
                        .regexReplaceAll(r'("national_id":\s*")\d{3}-\d{2}-(\d{4})"', '$$1***-**-$$2"')
                        .regexReplaceAll(r'("account_number":\s*")\d+(\d{4})"', '$$1********$$2"')
                        .regexReplaceAll(r'("email":\s*")[^"@]+@', '$$1***@')
                        .regexReplaceAll(r'("phone":\s*")[^"]*(\d{4})"', '$$1***-$$2"')
                        .regexReplaceAll(r'\b\d{3}-\d{2}-\d{4}\b', '[REDACTED]')
                        .regexReplaceAll(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '[REDACTED]')})
                    : item
                )
              }))
      backends:
      - mcp:
          targets:
          - name: finance
            mcp:
              # Reachable only on the internal Docker network.
              host: http://mcp-server:8000/mcp
