# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway v1.7 configuration for the MCP governance reference implementation.
#
# Policies so far: jwtAuth (Phase 4), mcpAuthorization (Phase 5), localRateLimit (Phase 6).
# Still to come: mcpGuardrails, logging/metrics.
# Until masking (Phase 7) is in place, Compose publishes the gateway on 127.0.0.1 only.

binds:
- port: 3000
  listeners:
  - name: mcp
    routes:
    - name: mcp-governance
      policies:
        # Every request needs a valid RS256 JWT from scripts/generate_credentials.sh.
        # Missing or invalid tokens are rejected before any MCP processing.
        jwtAuth:
          mode: strict
          issuer: agentgateway-mcp-governance
          audiences: [mcp-gateway]
          jwks:
            file: /credentials/jwks.json
        # Per-tool access by role. Rules are OR-ed; anything not allowed is denied.
        # Denied tools are removed from tools/list, and calls to them are rejected.
        # Allow rules only: an evaluation error then fails closed (no access).
        mcpAuthorization:
          rules:
          - 'jwt.role == "auditor"'
          - 'jwt.role == "analyst" && mcp.tool.name in ["get_customer", "get_account"]'
        # Per-user token bucket on HTTP requests (one MCP session uses ~5).
        # Each JWT subject gets its own bucket: bursts of up to 100, refilled at 20/s.
        localRateLimit:
        - type: requests
          key: jwt.sub
          maxTokens: 100
          tokensPerFill: 20
          fillInterval: 1s
      backends:
      - mcp:
          targets:
          - name: finance
            mcp:
              # Reachable only on the internal Docker network.
              host: http://mcp-server:8000/mcp
